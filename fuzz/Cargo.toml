[package]
name = "cargo-fallow-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Prevent this crate from joining the parent workspace
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# The same version and features as the syn entry in the root Cargo.toml.
syn = { version = "3", default-features = false, features = ["full", "parsing"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false
