[package]
name = "cargo-fallow"
version = "0.0.0"
edition = "2024"
# The floor of fallow-report-protocol.
rust-version = "1.97"
license = "MIT"
description = "Codebase analysis for Rust workspaces, as a Cargo subcommand"
repository = "https://github.com/fallow-rs/cargo-fallow"
readme = "README.md"
keywords = ["cargo", "cargo-subcommand", "static-analysis", "mutation-testing"]
categories = ["development-tools::cargo-plugins"]
# Remove at M4 launch.
publish = false
exclude = ["tests/fixtures"]

# The fixtures have their own `[workspace]` tables. This table keeps a fixture
# manifest out of the root workspace.
[workspace]
exclude = ["tests/fixtures"]

# The package installs only `cargo-fallow`. It never installs a binary named
# `fallow`, because that name belongs to the JavaScript CLI.
[[bin]]
name = "cargo-fallow"
path = "src/main.rs"

[dependencies]
# Path dependency for M0. Replace with a crates.io version before the first publish.
fallow-report-protocol = { path = "../fallow-report-protocol/crates/report-protocol" }
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
syn = { version = "3", default-features = false, features = ["full", "parsing"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Lint groups (priority -1 so individual overrides take precedence)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restriction lints, the same list as fallow.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
unwrap_used = "warn"
expect_used = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unused_result_ok = "warn"
infinite_loop = "warn"
self_named_module_files = "warn"
pathbuf_init_then_push = "warn"
excessive_nesting = "warn"
allow_attributes_without_reason = "warn"
unimplemented = "warn"
filetype_is_file = "warn"
rest_pat_in_fully_bound_structs = "warn"
pub_underscore_fields = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
map_with_unused_argument_over_ranges = "warn"
iter_on_single_items = "warn"
redundant_clone = "warn"
significant_drop_in_scrutinee = "warn"
suspicious_operation_groupings = "warn"
unused_peekable = "warn"
mem_forget = "warn"
lossy_float_literal = "warn"
mixed_read_write_in_expression = "warn"
try_err = "warn"
fn_to_numeric_cast_any = "warn"
float_cmp_const = "warn"
string_lit_chars_any = "warn"
format_push_string = "warn"
mutex_atomic = "warn"
suspicious_xor_used_as_pow = "warn"
empty_enum_variants_with_brackets = "warn"
multiple_unsafe_ops_per_block = "warn"
unwrap_in_result = "warn"
string_add = "warn"
redundant_type_annotations = "warn"
deref_by_slicing = "warn"

# Pedantic exceptions, the same as fallow.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
too_many_lines = "warn"
items_after_statements = "allow"
single_match_else = "allow"
redundant_closure_for_method_calls = "allow"
similar_names = "allow"

# The dependency tree has duplicate versions that this crate cannot remove,
# for example the windows-sys versions of clap and tempfile.
multiple_crate_versions = "allow"
