# Ported from fallow. fallow also updates its fuzz, editor, npm package,
# Docker and pip manifests. This repository has none of those.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # The parser crates need an API check. `ra-ap-rustc_lexer` also fails to
    # compile when the Unicode versions of these two crates differ, so they
    # move together with the parser.
    ignore:
      - dependency-name: "ra_ap_*"
      - dependency-name: "ra-ap-*"
      - dependency-name: "unicode-ident"
      - dependency-name: "unicode-properties"

  # The commitlint packages in package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # fallow lists only `/`. Here the composite action has its own pinned
  # actions, so the list names its directory too.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
