name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # M0 only. Cargo.toml reads fallow-report-protocol from
  # ../fallow-report-protocol/crates/report-protocol. Each job checks out this
  # repository into `cargo-fallow/` and the fallow repository at this commit
  # into `fallow-report-protocol/`, so the relative path resolves. Remove this
  # when the crate is on crates.io.
  FALLOW_REPOSITORY: fallow-rs/fallow
  FALLOW_PROTOCOL_REF: f59bd722ddf45332a02bc3b912a70c854a64006c

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cargo-fallow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cargo-fallow
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FALLOW_REPOSITORY }}
          ref: ${{ env.FALLOW_PROTOCOL_REF }}
          path: fallow-report-protocol
          persist-credentials: false
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cargo-fallow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cargo-fallow
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FALLOW_REPOSITORY }}
          ref: ${{ env.FALLOW_PROTOCOL_REF }}
          path: fallow-report-protocol
          persist-credentials: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: cargo-fallow
      # The pedantic, nursery and restriction lints come from [lints] in Cargo.toml.
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cargo-fallow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cargo-fallow
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FALLOW_REPOSITORY }}
          ref: ${{ env.FALLOW_PROTOCOL_REF }}
          path: fallow-report-protocol
          persist-credentials: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: cargo-fallow
      - run: cargo test --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cargo-fallow
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FALLOW_REPOSITORY }}
          ref: ${{ env.FALLOW_PROTOCOL_REF }}
          path: fallow-report-protocol
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: cargo-fallow/Cargo.toml
          command: check
          arguments: --all-features

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Each commit must have a Signed-off-by trailer for its author.
      # CONTRIBUTING.md describes the rule.
      - name: Check Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qxF "$author"; then
              echo "::error::Commit $sha has no 'Signed-off-by: $author' trailer."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the sign-off with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
